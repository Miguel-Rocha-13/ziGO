<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="img/logo.ico" type="image/x-icon">
        <title>ziGO</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="header-anuncios">
                <!-- Primer mensaje -->
                <div class="mensaje m1">
                    ¡Obtén el 100% de descuento en tu primera compra!
                </div>
                <!-- Segundo mensaje -->
                <div class="mensaje m2">
                    Comparte tu experiencia y recibe un 5% de descuento en tu siguiente compra
                </div>
            </div>
        </header>
        <nav class="menu-principal">
            <ul>
                <li><a href="index.html" class="nav-item">Inicio</a></li>
                <li><a href="#services" class="nav-item">Servicios</a></li>
                <li><a href="#about" class="nav-item">Acerca de</a></li>
                <li><a href="#contact" class="nav-item">Contactanos</a></li>
            </ul>
        </nav>
        <main class="hero-banner">
            <img src="img/zigo_main.jpeg" alt="ziGO Logo" class="zigo_main">
        </main>
        <div class="content">
            <a href="#">
                <div class="content-item">
                    <h1>Agenda tu cita</h1>
                    <img src="img/calendario_banner.png" alt="Calendario Banner" class="img_banner">
                    <button class="btn-zigo">Agendar</button>
                </div>
            </a>
            <a href="#">
                <div class="content-item">
                    <h1>Galería de armazones</h1>
                    <img src="img/lentes_banner.png" alt="Lentes Banner" class="img_banner">
                    <button class="btn-zigo">Ver colección completa</button>
                </div>
            </a>
            <a href="#">
                <div class="content-item">
                    <h1>Tipos de lente</h1>
                    <img src="img/tipo_lente_banner.png" alt="Tipos de Lente Banner" class="img_banner">
                    <button class="btn-zigo">Aprende más</button>
                </div>
            </a>
        </div>
    </body>
</html>
